[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-data-quality"
version = "0.1.0"
description = "Market data quality and analytics platform for historical futures data"
requires-python = ">=3.11"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100